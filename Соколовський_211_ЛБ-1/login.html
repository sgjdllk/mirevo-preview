<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Мірево</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-page">
        <form class="login-form" action="#" method="post">
            <h1>Вхід</h1>

            <label for="login-email">Електронна пошта</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>

            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" name="password" placeholder="Мінімум 8 символів" minlength="8" title="Пароль має містити щонайменше 8 символів" required>

            <button type="submit">Увійти</button>
            <button type="reset">Очистити</button>

            <p>Немає акаунту? <a href="register.html">Зареєструватися</a></p>
        </form>
    </main>
</body>
</html>
