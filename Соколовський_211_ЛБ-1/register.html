<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Мірево</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="auth-page">
        <form class="register-form" action="#" method="post">
            <h1>Реєстрація</h1>

            <label for="reg-name">Ім'я</label>
            <input type="text" id="reg-name" name="name" placeholder="Ваше ім'я" required>

            <label for="reg-email">Електронна пошта</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>

            <label for="reg-password">Пароль</label>
            <input type="password" id="reg-password" name="password" placeholder="Мінімум 8 символів" minlength="8" title="Пароль має містити щонайменше 8 символів" required>

            <label for="reg-password2">Повторіть пароль</label>
            <input type="password" id="reg-password2" name="password2" placeholder="Повторіть пароль" minlength="8" title="Пароль має містити щонайменше 8 символів" required>

            <button type="submit">Зареєструватися</button>
            <button type="reset">Очистити</button>

            <p>Вже маєте акаунт? <a href="login.html">Увійти</a></p>
        </form>
    </main>
<body>
    
</body>
</html>
